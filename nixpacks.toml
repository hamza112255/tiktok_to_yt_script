[phases.setup]
# Use Nix packages (primary — Railway's nixpacks is Nix-based)
nixPkgs = ['ffmpeg']
# Also request via apt as belt-and-suspenders fallback
aptPkgs = ['ffmpeg']

[phases.install]
cmds = ['pip install -r requirements-railway.txt']

[start]
cmd = 'python -u railway_runtime_setup.py && python -u all_platforms_youtube.py'
